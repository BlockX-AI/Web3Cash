name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build
        env:
          # Build-time placeholders — real values come from Vercel/Railway.
          DATABASE_URL: postgresql://placeholder
          REDIS_URL: redis://placeholder
          JWT_SECRET: ci-placeholder-secret-32-chars-long-1234
          SIWE_DOMAIN: localhost:3000
          ALCHEMY_API_KEY: placeholder
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: placeholder
