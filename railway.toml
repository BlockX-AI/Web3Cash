# Web3Cash Railway Configuration
# This configures all services: API, Worker, PostgreSQL, and Redis

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run db:generate && npm run build -w @web3cash/api && npm run build -w @web3cash/worker"

# API Service (Primary)
[api]
startCommand = "npm run db:migrate:deploy && npm run start -w @web3cash/api"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Worker Service (Background Jobs)
[worker]
startCommand = "npm run start -w @web3cash/worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# PostgreSQL Database
[postgres]
# Railway automatically configures this
# DATABASE_URL will be injected

# Redis
[redis]
# Railway automatically configures this
# REDIS_URL will be injected
